<g font-family="system-ui, sans-serif" fill="#172b40">
<text x="34" y="35" font-size="19" font-weight="700">Geometry and ownership</text><text x="34" y="60" font-size="14">NEML2 domain D = {A, B}</text>
<rect x="76" y="88" width="478" height="190" rx="3" fill="#eff7fc" stroke="#1678b9" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="76" y="280" width="478" height="67" rx="4" fill="#f1f5f9"/>
<path d="M315 88V278" stroke="#aab9c5" stroke-width="1.5"/>
