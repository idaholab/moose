<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">NEML2 sideset geometry and evaluation</title><desc id="desc">Blocks A and B are inside D, C is outside. Four colored sides illustrate external boundary, domain boundary, internal interface and reversed ownership. The internal interface inset compares owner-only and two-sided evaluation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#475569"/></marker></defs>
