<text x="610" y="35" font-size="19" font-weight="700">Case 3: evaluation modes</text>
<g font-size="14" font-weight="600"><text x="610" y="68">boundary · owner only</text><text x="610" y="225">interface · both sides</text></g>
<g fill="#eff7fc" stroke="#1678b9" stroke-width="1.5" stroke-dasharray="6 4"><rect x="610" y="82" width="317" height="96" rx="4"/><rect x="610" y="239" width="317" height="96" rx="4"/></g>
