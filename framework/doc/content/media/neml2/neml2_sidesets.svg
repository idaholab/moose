<g fill="#ce7710"><circle cx="147" cy="264" r="4"/><circle cx="194" cy="264" r="4"/><circle cx="240" cy="264" r="4"/></g>
<g fill="#258346"><circle cx="301" cy="150" r="4"/><circle cx="301" cy="176" r="4"/><circle cx="301" cy="202" r="4"/><circle cx="329" cy="150" r="4"/><circle cx="329" cy="176" r="4"/><circle cx="329" cy="202" r="4"/></g>
<g stroke="#475569" stroke-width="1.7" marker-end="url(#arrow)"><path d="M194 284V312"/><path d="M437 312V284"/></g>
